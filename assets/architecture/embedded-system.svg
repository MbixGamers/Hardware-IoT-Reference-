<svg xmlns="http://w3.org" viewBox="0 0 1000 900" width="100%" height="100%" style="background-color: #f7f9fc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Soft Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Outer Dashed Ring / Circular Trajectory -->
  <circle cx="500" cy="430" r="320" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="12 16" opacity="0.35" />

  <!-- Central Title Hub -->
  <g transform="translate(500, 430)">
    <rect x="-180" y="-65" width="360" height="130" rx="20" fill="#ffffff" filter="url(#drop-shadow)" />
    <text x="0" y="-12" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Embedded</text>
    <text x="0" y="32" text-anchor="middle" font-size="40" font-weight="900" fill="#2563eb" letter-spacing="0.5">Systems</text>
  </g>

  <!-- ==================== 1. MANUFACTURING EQUIPMENT (TOP) ==================== -->
  <g transform="translate(500, 110)">
    <circle cx="0" cy="-35" r="32" fill="#eff6ff" />
    <g transform="translate(-20, -55) scale(1.1)" fill="#4f46e5">
      <path d="M4 28h24v2H4zm2-14h8v10H6zm10-4h4v14h-4zm6 6h4v8h-4z" opacity="0.3"/>
      <path d="M6 24h14v-6H12v-6H8v6H6v6zm16-12h2v14h4v2h-6v-16zm-14 14a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm12 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Manufacturing</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">equipment</text>
  </g>

  <!-- ==================== 2. DOMESTIC APPLIANCES (TOP RIGHT) ==================== -->
  <g transform="translate(760, 220)">
    <circle cx="0" cy="-35" r="32" fill="#fffbeb" />
    <g transform="translate(-18, -55) scale(1.1)" fill="#d97706">
      <path d="M12 6h12l4 12H8l4-12z" />
      <path d="M17 18h2v10h-2zm-3 10h8v2h-8z" opacity="0.8" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Domestic</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">appliances</text>
  </g>

  <!-- ==================== 3. AUDIO-VISUAL EQUIPMENT (RIGHT) ==================== -->
  <g transform="translate(840, 480)">
    <circle cx="0" cy="-35" r="32" fill="#faf5ff" />
    <g transform="translate(-18, -52) scale(1.1)" fill="#7c3aed">
      <path d="M6 10h20a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2zm1 3v11h14V13H7zm16 2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z" />
      <path d="M11 6l4 4h-2l-4-4zm10 0l-4 4h2l4-4z" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Audio-visual</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">equipment</text>
  </g>

  <!-- ==================== 4. GAMING CONSOLES (BOTTOM RIGHT) ==================== -->
  <g transform="translate(740, 710)">
    <circle cx="0" cy="-35" r="32" fill="#fff7ed" />
    <g transform="translate(-20, -50) scale(1.1)" fill="#ea580c">
      <rect x="4" y="10" width="28" height="16" rx="4" />
      <rect x="10" y="13" width="16" height="10" fill="#fff7ed" />
      <path d="M6 18h3m-1.5-1.5v3" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="28" cy="16" r="1" />
      <circle cx="28" cy="20" r="1" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Gaming</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">consoles</text>
  </g>

  <!-- ==================== 5. TELECOMMUNICATION EQUIPMENT (BOTTOM) ==================== -->
  <g transform="translate(500, 790)">
    <circle cx="0" cy="-35" r="32" fill="#f5f3ff" />
    <g transform="translate(-18, -55) scale(1.1)" fill="#6d28d9">
      <path d="M16 6a2 2 0 1 1 4 0 2 2 0 0 1-4 0z" />
      <path d="M12 28l5-18h2l5 18h-2l-1.5-6h-7L12 28zm4.5-8h5l-2.5-9-2.5 9z" />
      <path d="M11 8A6 6 0 0 1 14 3" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round" />
      <path d="M25 8A6 6 0 0 0 22 3" fill="none" stroke="#6d28d9" stroke-width="1.5" stroke-linecap="round" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Telecommunication</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">equipment</text>
  </g>

  <!-- ==================== 6. MEDICAL DEVICES (BOTTOM LEFT) ==================== -->
  <g transform="translate(250, 700)">
    <circle cx="0" cy="-35" r="32" fill="#fffbeb" />
    <g transform="translate(-16, -55) scale(1.1)" fill="#b45309">
      <path d="M12 26h12v2H12zm4-18h4v4h-4zm0 6h6v2h-6zm-4 4h4v6h-4z" opacity="0.3"/>
      <path d="M18 6a3 3 0 0 0-3 3v4h2V9a1 1 0 0 1 1-1h4V6h-4zm-2 9h4v6h-4zm-4 8h14v2H12z" />
      <path d="M8 12a10 10 0 0 0 10 10v-2a8 8 0 0 1-8-8H8z" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Medical</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">devices</text>
  </g>

  <!-- ==================== 7. CARS AND VEHICLES (LEFT) ==================== -->
  <g transform="translate(160, 460)">
    <circle cx="0" cy="-35" r="32" fill="#eef2f6" />
    <g transform="translate(-18, -52) scale(1.1)" fill="#1e40af">
      <path d="M6 16c0-2 2-5 6-6h12c4 0 6 3 6 5v6H6v-5z" opacity="0.4" />
      <path d="M4 20v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-1h12v1a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4l-2-5H6l-2 5zm6-3a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm14 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Cars and</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">vehicles</text>
  </g>

  <!-- ==================== 8. MOTION SENSORS (TOP LEFT) ==================== -->
  <g transform="translate(240, 210)">
    <circle cx="0" cy="-35" r="32" fill="#fff7ed" />
    <g transform="translate(-16, -55) scale(1.1)" fill="#ea580c">
      <path d="M8 8h10v6H8zm2 8h6v10H10z" opacity="0.3" />
      <path d="M6 6h12v6H6zm4 8h4v10h-4zm10-6h2v4h-2zm4-2h2v8h-2z" />
    </g>
    <text x="0" y="25" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">Motion</text>
    <text x="0" y="45" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">sensors</text>
  </g>

  <!-- Branding Attribution Layer (SaM Solutions) -->
  <g transform="translate(60, 830)" opacity="0.85">
    <rect x="0" y="5" width="10" height="10" fill="#1e3a8a" rx="1" />
    <rect x="12" y="0" width="10" height="10" fill="#2563eb" rx="1" />
    <rect x="6" y="12" width="10" height="10" fill="#3b82f6" rx="1" />
    <text x="28" y="14" font-size="15" font-weight="800" fill="#1e3a8a" letter-spacing="-0.3">sam</text>
    <text x="28" y="26" font-size="13" font-weight="700" fill="#2563eb" letter-spacing="0.5">solutions</text>
  </g>
</svg>
