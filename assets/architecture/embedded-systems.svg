<svg xmlns="http://w3.org" viewBox="0 0 1000 900" width="100%" height="100%" style="background-color: #f8fafc;">

  <!-- Your internal SVG elements (circles, paths, text labels) stay exactly here -->
  <!-- Definitions for styling and reusable elements -->
  <defs>
    <style>
      .bg { fill: #F7F9FC; }
      .center-title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #0F1E54; text-anchor: middle; }
      .center-subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #0F1E54; text-anchor: middle; }
      .label-text { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 20px; fill: #0F1E54; text-anchor: middle; }
      .line-arch { fill: none; stroke: #2E4080; stroke-width: 1.5; }
      .logo-text { font-family: 'Arial Black', Gadget, sans-serif; font-weight: 900; font-size: 24px; fill: #0F1E54; }
      .logo-sub { font-family: 'Arial Black', Gadget, sans-serif; font-weight: 900; font-size: 20px; fill: #1E60C0; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="900" class="bg" />

  <!-- Outer connecting circular arcs -->
  <!-- Center at (500, 440), radius approx 340 -->
  <path d="M 500,90 A 350,350 0 0,1 760,195" class="line-arch" />
  <path d="M 800,245 A 350,350 0 0,1 860,400" class="line-arch" />
  <path d="M 860,480 A 350,350 0 0,1 780,670" class="line-arch" />
  <path d="M 720,730 A 350,350 0 0,1 590,795" class="line-arch" />
  <path d="M 410,795 A 350,350 0 0,1 280,730" class="line-arch" />
  <path d="M 220,670 A 350,350 0 0,1 140,480" class="line-arch" />
  <path d="M 140,400 A 350,350 0 0,1 200,245" class="line-arch" />
  <path d="M 240,195 A 350,350 0 0,1 500,90" class="line-arch" />

  <!-- Central Text -->
  <text x="500" y="420" class="center-title">Embedded</text>
  <text x="500" y="485" class="center-subtitle">Systems</text>

  <!-- 1. Manufacturing Equipment (Top) -->
  <g transform="translate(500, 110)">
    <!-- Forklift Icon -->
    <g transform="translate(-30, -75) scale(1.3)" fill="#68349A">
      <path d="M10,35 L30,35 L35,23 L25,23 Z" />
      <rect x="5" y="15" width="6" height="22" />
      <rect x="2" y="32" width="4" height="5" />
      <circle cx="12" cy="38" r="4" />
      <circle cx="26" cy="38" r="4" />
      <path d="M34,10 L36,10 L36,37 L34,37 Z" />
      <path d="M36,32 L44,32 L44,35 L36,35 Z" />
    </g>
    <text x="0" y="10" class="label-text">Manufacturing</text>
    <text x="0" y="32" class="label-text">equipment</text>
  </g>

  <!-- 2. Domestic Appliances (Top Right) -->
  <g transform="translate(800, 240)">
    <!-- Lamp Icon -->
    <g transform="translate(-25, -65) scale(1.2)" fill="#F0A818">
      <path d="M10,30 L40,30 L33,10 L17,10 Z" />
      <rect x="23" y="30" width="4" height="15" />
      <path d="M15,45 L35,45 L38,50 L12,50 Z" />
    </g>
    <text x="0" y="15" class="label-text">Domestic</text>
    <text x="0" y="37" class="label-text">appliances</text>
  </g>

  <!-- 3. Audio-visual Equipment (Right) -->
  <g transform="translate(860, 480)">
    <!-- Television Icon -->
    <g transform="translate(-30, -65) scale(1.2)" fill="#844494">
      <rect x="5" y="15" width="45" height="32" rx="5" />
      <rect x="9" y="19" width="31" height="24" fill="#F7F9FC" />
      <circle cx="44" cy="23" r="2" />
      <circle cx="44" cy="29" r="2" />
      <line x1="20" y1="15" x2="12" y2="5" stroke="#844494" stroke-width="2" />
      <line x1="30" y1="15" x2="38" y2="5" stroke="#844494" stroke-width="2" />
    </g>
    <text x="0" y="15" class="label-text">Audio-visual</text>
    <text x="0" y="37" class="label-text">equipment</text>
  </g>

  <!-- 4. Gaming Consoles (Bottom Right) -->
  <g transform="translate(790, 700)">
    <!-- Handheld Console Icon -->
    <g transform="translate(-35, -60) scale(1.1)" fill="#E69010">
      <rect x="5" y="15" width="55" height="30" rx="8" />
      <rect x="18" y="20" width="28" height="20" fill="#F7F9FC" />
      <!-- D-Pad -->
      <path d="M11,26 L13,26 L13,24 L15,24 L15,26 L17,26 L17,28 L15,28 L15,30 L13,30 L13,28 L11,28 Z" fill="#F7F9FC" />
      <!-- Buttons -->
      <circle cx="51" cy="26" r="2" fill="#F7F9FC" />
      <circle cx="55" cy="30" r="2" fill="#F7F9FC" />
    </g>
    <text x="0" y="15" class="label-text">Gaming</text>
    <text x="0" y="37" class="label-text">consoles</text>
  </g>

  <!-- 5. Telecommunication Equipment (Bottom) -->
  <g transform="translate(500, 800)">
    <!-- Antenna Tower Icon -->
    <g transform="translate(-25, -75) scale(1.2)" fill="#543494">
      <path d="M22,30 L28,30 L35,60 L15,60 Z" fill="none" stroke="#543494" stroke-width="3" />
      <line x1="18" y1="45" x2="32" y2="45" stroke="#543494" stroke-width="2" />
      <line x1="21" y1="35" x2="29" y2="35" stroke="#543494" stroke-width="2" />
      <circle cx="25" cy="25" r="4" />
      <!-- Waves -->
      <path d="M15,20 A15,15 0 0,1 15,30" fill="none" stroke="#543494" stroke-width="2" />
      <path d="M10,15 A22,22 0 0,1 10,35" fill="none" stroke="#543494" stroke-width="1.5" />
      <path d="M35,20 A15,15 0 0,0 35,30" fill="none" stroke="#543494" stroke-width="2" />
      <path d="M40,15 A22,22 0 0,0 40,35" fill="none" stroke="#543494" stroke-width="1.5" />
    </g>
    <text x="0" y="15" class="label-text">Telecommunication</text>
    <text x="0" y="37" class="label-text">equipment</text>
  </g>

  <!-- 6. Medical Devices (Bottom Left) -->
  <g transform="translate(200, 700)">
    <!-- Microscope Icon -->
    <g transform="translate(-25, -65) scale(1.2)" fill="#ECA414">
      <path d="M15,45 L35,45 L35,48 L15,48 Z" />
      <path d="M30,45 C30,30 20,30 20,25 L23,25 C23,30 33,30 33,45 Z" />
      <rect x="13" y="15" width="6" height="18" transform="rotate(-25 15 15)" />
      <rect x="18" y="28" width="10" height="4" />
    </g>
    <text x="0" y="15" class="label-text">Medical</text>
    <text x="0" y="37" class="label-text">devices</text>
  </g>

  <!-- 7. Cars and Vehicles (Left) -->
  <g transform="translate(150, 480)">
    <!-- Car Icon -->
    <g transform="translate(-30, -60) scale(1.2)" fill="#5444C4">
      <path d="M10,25 L15,15 L35,15 L40,25 L48,25 L50,35 L2,35 L4,25 Z" />
      <circle cx="12" cy="37" r="4" fill="#F7F9FC" stroke="#5444C4" stroke-width="2" />
      <circle cx="40" cy="37" r="4" fill="#F7F9FC" stroke="#5444C4" stroke-width="2" />
      <rect x="16" y="18" width="9" height="6" fill="#F7F9FC" />
      <rect x="27" y="18" width="9" height="6" fill="#F7F9FC" />
    </g>
    <text x="0" y="15" class="label-text">Cars and</text>
    <text x="0" y="37" class="label-text">vehicles</text>
  </g>

  <!-- 8. Motion Sensors (Top Left) -->
  <g transform="translate(200, 240)">
    <!-- Sensor/Scanner Icon -->
    <g transform="translate(-30, -65) scale(1.1)" fill="#ECA014">
      <path d="M15,20 L35,15 L40,35 L30,40 L28,50 L20,50 L22,38 L15,35 Z" />
      <!-- Signal Lines -->
      <line x1="48" y1="12" x2="48" y2="38" stroke="#ECA014" stroke-width="3" />
      <line x1="54" y1="15" x2="54" y2="35" stroke="#ECA014" stroke-width="3" />
      <line x1="60" y1="18" x2="60" y2="32" stroke="#ECA014" stroke-width="3" />
    </g>
    <text x="0" y="15" class="label-text">Motion</text>
    <text x="0" y="37" class="label-text">sensors</text>
  </g>

  <!-- Logo (Bottom Left Corner) -->
  <g transform="translate(70, 830)">
    <!-- Simple representation of the square cluster logo -->
    <rect x="5" y="5" width="12" height="12" fill="#2E60C0" />
    <rect x="20" y="0" width="10" height="10" fill="#88A8D8" />
    <rect x="15" y="14" width="14" height="14" fill="#5478B8" />
    <text x="2" y="42" class="logo-text">sam</text>
    <text x="2" y="58" class="logo-sub">solutions</text>
  </g>
</svg>
